services:
  app:
    build: .
    container_name: employee-app
    ports:
      - "5000:5000"

    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_NAME: employee_db
      DB_USER: krishna
      DB_PASSWORD: krishna@9451

  db:
    image: postgres:17

    container_name: postgres-db

    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: krishna
      POSTGRES_PASSWORD: krishna@9451

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
